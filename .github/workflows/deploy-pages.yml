name: 100% GitHub-Native Deployment (GitHub Pages)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. pytest tests/
          echo "Unit tests passed successfully"

      - name: DevSecOps Python AST Security Audit (Bandit)
        run: |
          bandit -r app/ -ll
          echo "Bandit security audit passed with 0 vulnerabilities"

      - name: DevSecOps Secret Scanner (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

  deploy-pages:
    name: Continuous Deployment (GitHub Pages)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Gemini API Key Secret
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os
          k = os.environ.get('GEMINI_KEY', '')
          if k:
              with open('public/index.html', 'r', encoding='utf-8') as f:
                  c = f.read()
              c = c.replace('__GEMINI_API_KEY__', k)
              with open('public/index.html', 'w', encoding='utf-8') as f:
                  f.write(c)
              print('Successfully injected GEMINI_API_KEY into public/index.html')
          else:
              print('Warning: GEMINI_API_KEY secret is not set')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
