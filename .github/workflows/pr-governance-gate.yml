name: PR DevSecOps & AI Governance Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  # ============================================================================
  # JOB 1: Separation of Duties (SoD) Persona & Authorization Audit
  # ============================================================================
  sod-governance-audit:
    name: Separation of Duties (SoD) Audit
    runs-on: ubuntu-latest
    steps:
      - name: Perform Separation of Duties (SoD) Verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          github_token = os.environ.get("GITHUB_TOKEN")
          pr_number = os.environ.get("PR_NUMBER")
          pr_author = os.environ.get("PR_AUTHOR", "").strip()
          repo = os.environ.get("REPO", "").strip()

          AUTHORIZED_DEVELOPER = "vign87a-dev"
          AUTHORIZED_LEAD = "vign87a-lead"
          DEVELOPER_EMAIL = "vign87a+gitdev@gmail.com"
          LEAD_EMAIL = "vign87a+gitlead@gmail.com"

          violations = []
          warnings = []

          print("=" * 70)
          print("🛡️ THETRON DEVSECOPS: SEPARATION OF DUTIES (SoD) AUDIT")
          print("=" * 70)
          print(f"Repository:   {repo}")
          print(f"PR Number:    #{pr_number}")
          print(f"PR Author:    {pr_author}")
          print("-" * 70)

          # ----------------------------------------------------------------------
          # CHECK 1: PR Author Identity
          # ----------------------------------------------------------------------
          if pr_author == AUTHORIZED_LEAD:
              violations.append(
                  f"❌ **PR Author Violation**: PR was opened by `{AUTHORIZED_LEAD}`. "
                  f"Pursuant to strict Separation of Duties (Interpretation A), `{AUTHORIZED_LEAD}` "
                  f"is strictly an Audit & Merge persona and is **prohibited from creating Pull Requests**."
              )
          elif pr_author != AUTHORIZED_DEVELOPER:
              violations.append(
                  f"❌ **Unauthorized PR Author**: PR was opened by `{pr_author}`. "
                  f"Only `{AUTHORIZED_DEVELOPER}` is authorized to create feature branches and open Pull Requests."
              )
          else:
              print(f"✅ Check 1: PR author is verified as '{AUTHORIZED_DEVELOPER}'.")

          # ----------------------------------------------------------------------
          # CHECK 2: Commit Author Verification
          # ----------------------------------------------------------------------
          headers = {
              "Authorization": f"Bearer {github_token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "THETRON-Governance-Gate"
          }

          commits_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/commits"
          try:
              req = urllib.request.Request(commits_url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  commits = json.loads(resp.read().decode("utf-8"))
                  print(f"Auditing {len(commits)} commit(s) in PR #{pr_number}...")

                  for c in commits:
                      sha = c.get("sha", "")[:7]
                      commit_data = c.get("commit", {})
                      author_info = commit_data.get("author", {})
                      author_name = author_info.get("name", "")
                      author_email = author_info.get("email", "")
                      author_login = c.get("author", {}).get("login", "") if c.get("author") else ""

                      print(f"  • Commit {sha}: Author='{author_name}' <{author_email}> (login: {author_login})")

                      if author_email.lower() == LEAD_EMAIL.lower() or author_login == AUTHORIZED_LEAD or AUTHORIZED_LEAD in author_name:
                          violations.append(
                              f"❌ **Commit Author Violation**: Commit `{sha}` was authored by `{AUTHORIZED_LEAD}`. "
                              f"`{AUTHORIZED_LEAD}` is prohibited from authoring commits. All commits must originate from `{AUTHORIZED_DEVELOPER}`."
                          )
          except Exception as e:
              print(f"⚠️ Warning: Could not retrieve commits via GitHub API: {e}")

          # ----------------------------------------------------------------------
          # CHECK 3: PR Review & Approval Verification
          # ----------------------------------------------------------------------
          reviews_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}/reviews"
          lead_approved = False

          try:
              req = urllib.request.Request(reviews_url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  reviews = json.loads(resp.read().decode("utf-8"))
                  print(f"Auditing {len(reviews)} review(s) in PR #{pr_number}...")

                  for r in reviews:
                      reviewer = r.get("user", {}).get("login", "")
                      state = r.get("state", "")

                      print(f"  • Review by @{reviewer}: State={state}")

                      # Self-approval check
                      if reviewer == AUTHORIZED_DEVELOPER and state == "APPROVED":
                          violations.append(
                              f"❌ **Self-Approval Violation**: `{AUTHORIZED_DEVELOPER}` attempted to approve their own PR. "
                              f"Developers cannot approve their own pull requests."
                          )

                      # Lead approval check
                      if reviewer == AUTHORIZED_LEAD and state == "APPROVED":
                          lead_approved = True

          except Exception as e:
              print(f"⚠️ Warning: Could not retrieve reviews via GitHub API: {e}")

          if not lead_approved:
              warnings.append(
                  f"⏳ **Awaiting Lead Approval**: Mandatory review and sign-off from `@{AUTHORIZED_LEAD}` "
                  f"is required before this PR can be merged."
              )

          # ----------------------------------------------------------------------
          # Report & Enforce
          # ----------------------------------------------------------------------
          print("-" * 70)
          if violations:
              print("🛑 GOVERNANCE AUDIT FAILED WITH VIOLATIONS:")
              for v in violations:
                  print(f"  - {v}")

              # Post failure comment to PR
              comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
              comment_body = (
                  "### 🛑 THETRON DevSecOps: Separation of Duties (SoD) Violation\n\n"
                  + "\n\n".join(violations)
                  + "\n\n---\n"
                  + f"**Mandatory Policy (Interpretation A)**:\n"
                  + f"- **Developer (`{AUTHORIZED_DEVELOPER}`)**: Authors feature branches, commits code, and creates Pull Requests.\n"
                  + f"- **Lead (`{AUTHORIZED_LEAD}`)**: Reviews code, enforces CI security gates, and merges Pull Requests.\n"
                  + f"- **Mutual Exclusivity**: Roles cannot be swapped or combined."
              )
              try:
                  c_req = urllib.request.Request(
                      comment_url,
                      data=json.dumps({"body": comment_body}).encode("utf-8"),
                      headers={"Content-Type": "application/json", **headers}
                  )
                  urllib.request.urlopen(c_req, timeout=15)
              except Exception as e:
                  print(f"Failed to post comment: {e}")

              sys.exit(1)

          if not lead_approved:
              print("⏳ PENDING: All author invariants passed. Awaiting sign-off from vign87a-lead.")
              sys.exit(1)

          print("✅ SUCCESS: Separation of Duties (SoD) verified. Approved by vign87a-lead.")
          sys.exit(0)
          EOF

  # ============================================================================
  # JOB 2: Autonomous AI Architectural & Security Code Review (Gemini 3.6 Flash)
  # ============================================================================
  ai-code-review:
    name: AI Architectural & Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Perform AI Review with Gemini 3.6 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - << 'EOF'
          import os
          import subprocess
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ.get("GEMINI_API_KEY")
          github_token = os.environ.get("GITHUB_TOKEN")
          pr_number = os.environ.get("PR_NUMBER")
          repo = os.environ.get("REPO")
          base_ref = os.environ.get("BASE_REF")

          if not api_key:
              print("GEMINI_API_KEY is not configured in repository secrets. Skipping AI review.")
              exit(0)

          # Fetch base branch to ensure diff is accurate
          subprocess.run(["git", "fetch", "origin", base_ref], check=False)

          # Get git diff against base branch
          diff_proc = subprocess.run(
              ["git", "diff", f"origin/{base_ref}...HEAD"],
              capture_output=True,
              text=True,
              errors="replace"
          )
          diff_text = diff_proc.stdout.strip()

          if not diff_text:
              print("No git diff detected. Skipping AI review.")
              exit(0)

          # Limit diff to ~25,000 characters to ensure fast turnaround and avoid token saturation
          if len(diff_text) > 25000:
              diff_text = diff_text[:25000] + "\n\n... [Diff truncated for length] ..."

          system_prompt = (
              "You are the Autonomous AI Code Reviewer for this enterprise repository, acting as a Principal DevSecOps and AI Architect.\n"
              "Review the pull request git diff below and provide a concise, professional, constructive review in clean GitHub markdown.\n\n"
              "Include the following sections:\n"
              "### 🤖 Autonomous AI Code Review (Gemini 3.6 Flash)\n\n"
              "1. **Summary of Changes**: 2-3 sentences explaining what this PR accomplishes.\n"
              "2. **Security & Secrets Audit**: Verify no hardcoded API keys, private keys, or credentials are exposed.\n"
              "3. **Architecture & Code Quality**: Critique code cleanliness, potential edge cases, and performance considerations.\n"
              "4. **Testing & Reliability**: Evaluate test coverage or suggest testing considerations.\n"
              "5. **Audit Verdict**: Choose one: `✅ LGTM - Ready for Lead Review` or `⚠️ Action Items Recommended`.\n\n"
              "Keep the tone encouraging, rigorous, and executive-ready."
          )

          gemini_endpoint = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key={api_key}"
          payload = {
              "contents": [
                  {
                      "parts": [
                          {"text": f"{system_prompt}\n\n### Git Diff to Review:\n```diff\n{diff_text}\n```"}
                      ]
                  }
              ]
          }

          try:
              req = urllib.request.Request(
                  gemini_endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
                  review_comment = result.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "")
          except Exception as e:
              print(f"Error invoking Gemini API: {e}")
              exit(0)

          if not review_comment:
              print("Empty response from Gemini API.")
              exit(0)

          # Post comment to PR
          comment_endpoint = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          comment_payload = {"body": review_comment}

          try:
              c_req = urllib.request.Request(
                  comment_endpoint,
                  data=json.dumps(comment_payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "Autonomous-AI-Reviewer"
                  }
              )
              with urllib.request.urlopen(c_req, timeout=15) as c_resp:
                  print("AI Review comment posted successfully to PR.")
          except Exception as e:
              print(f"Failed to post comment to GitHub PR: {e}")
          EOF
